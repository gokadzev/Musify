name: musify
description: Music Streaming app made in Flutter!
homepage: https://github.com/gokadzev/Musify
repository: https://github.com/gokadzev/Musify
issue_tracker: https://github.com/gokadzev/Musify/issues

publish_to: 'none'
version: 10.4.0+181 # run update.sh after changing the version

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ^3.47.2

dependencies:
  app_links: ^7.2.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.0
  dynamic_color: ^2.1.0
  file_picker: ^12.1.3
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  receive_sharing_intent:
    path: ./packages/receive_sharing_intent
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  youtube_explode_dart:
    path: ./packages/youtube_explode_dart
  youtube_music_explode_dart:
    path: ./packages/youtube_music_explode_dart
dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/licenses/
    - assets/icons/musify_icon.png

  fonts:
    - family: paytoneOne
      fonts:
        - asset: assets/fonts/paytone/PaytoneOne-Regular.ttf
